<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OwnMediaHost — Live System Status</title>
  <meta name="description" content="Redirecting to OwnMediaHost out-of-band live system status page.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232ea043'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-card: #161b22;
      --border-color: #30363d;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --accent-green: #238636;
      --accent-green-bright: #2ea043;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .redirect-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent-green-bright);
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent-green-bright);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 10px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn-redirect {
      display: inline-block;
      background: var(--accent-green);
      color: #ffffff;
      font-weight: 500;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .btn-redirect:hover {
      background: var(--accent-green-bright);
    }
    .target-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 16px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="brand-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>
    <h1>System Status &amp; Telemetry</h1>
    <p>Redirecting to out-of-band live operational status dashboard...</p>
    <div class="spinner"></div>
    <div class="target-url" id="target-display">Resolving destination...</div>
    <div style="margin-top: 24px;">
      <a href="#" id="direct-link" class="btn-redirect">Open Status Page</a>
    </div>
  </div>

  <script>
    (async function() {
      // Determine default destination
      let targetUrl = '';
      const hostname = window.location.hostname;
      const protocol = window.location.protocol;

      // 1. Try to fetch custom status_page_url setting from backend if reachable
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 1200);
        const res = await fetch('/api/v1/settings', { signal: controller.signal });
        clearTimeout(timeout);
        if (res.ok) {
          const data = await res.json();
          if (data && data.data && data.data.status_page_url) {
            targetUrl = data.data.status_page_url.trim();
          }
        }
      } catch (_) {}

      // 2. Fallback to status.<root_domain>
      if (!targetUrl) {
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          targetUrl = 'https://betterstack.com';
        } else {
          // If subdomain like media.example.com -> status.example.com
          const parts = hostname.split('.');
          if (parts.length >= 2) {
            const domain = parts.slice(-2).join('.');
            targetUrl = `${protocol}//status.${domain}`;
          } else {
            targetUrl = `${protocol}//status.${hostname}`;
          }
        }
      }

      const display = document.getElementById('target-display');
      const directLink = document.getElementById('direct-link');
      if (display) display.textContent = targetUrl;
      if (directLink) directLink.href = targetUrl;

      // Automatically forward after a brief moment
      setTimeout(() => {
        window.location.replace(targetUrl);
      }, 400);
    })();
  </script>
</body>
</html>
