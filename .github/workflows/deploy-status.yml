name: Deploy Public Status Page to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'status/**'
      - '.github/workflows/deploy-status.yml'
  workflow_dispatch:
    inputs:
      custom_domain:
        description: 'Optional Custom Domain (e.g. status.yourdomain.com)'
        required: false
        type: string

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages-status'
  cancel-in-progress: true

jobs:
  deploy-status:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Apply Custom CNAME Domain (if provided)
        shell: bash
        run: |
          if [ -n "${{ inputs.custom_domain }}" ]; then
            echo "${{ inputs.custom_domain }}" > status/CNAME
            echo "Configured CNAME: ${{ inputs.custom_domain }}"
          fi

      - name: Upload Status Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './status'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
